name: boilerroom-tds-portfolio

services:
  postgres:
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    container_name: boilerroom-tds-portfolio-postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Initialize the local .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Initialize the local .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Initialize the local .env first}
      TDS_APP_DB_USER: ${TDS_APP_DB_USER:?Initialize the local .env first}
      TDS_APP_DB_PASSWORD: ${TDS_APP_DB_PASSWORD:?Initialize the local .env first}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${TDS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    labels:
      io.boilerroom-tds.scope: local-synthetic-only

volumes:
  pgdata:
    name: boilerroom-tds-portfolio-pgdata
    labels:
      io.boilerroom-tds.scope: local-synthetic-only
