name: Complete dependency security checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: pwsh -NoProfile -File scripts/Test-Frontend.ps1 -Task Restore
      - name: Fail-closed exception policy tests
        run: node --test scripts/npm-audit-policy.test.cjs
      - name: Full audit, exact disclosed exception, strict production and signatures
        run: pwsh -NoProfile -File scripts/Test-Dependencies.ps1 -Check Npm
  nuget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: pwsh -NoProfile -File scripts/Test-Backend.ps1 -Task Restore
      - name: Complete backend and test dependency graphs
        run: pwsh -NoProfile -File scripts/Test-Dependencies.ps1 -Check NuGet
