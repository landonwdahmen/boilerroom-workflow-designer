name: Backend and isolated PostgreSQL
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Locked test dependency restore and complete advisory check
        run: pwsh -NoProfile -File scripts/Test-Backend.ps1 -Task Restore
      - name: Release builds
        run: pwsh -NoProfile -File scripts/Test-Backend.ps1 -Task Build
      - name: Fast backend unit tests
        run: pwsh -NoProfile -File scripts/Test-Backend.ps1 -Task Unit
      - name: Obtain exact reviewed PostgreSQL image
        run: docker pull postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
      - name: Disposable PostgreSQL controller and schema tests
        run: pwsh -NoProfile -File scripts/Test-IsolatedDatabase.ps1 -Suite Database
