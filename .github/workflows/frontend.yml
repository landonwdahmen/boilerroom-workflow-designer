name: Frontend verification
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Restore reviewed lock without lifecycle hooks
        run: pwsh -NoProfile -File scripts/Test-Frontend.ps1 -Task Restore
      - name: Unit and component tests
        run: pwsh -NoProfile -File scripts/Test-Frontend.ps1 -Task Unit
      - name: Production compilation
        run: pwsh -NoProfile -File scripts/Test-Frontend.ps1 -Task Build
      - name: Lint (existing warnings remain visible)
        run: pwsh -NoProfile -File scripts/Test-Frontend.ps1 -Task Lint
      - name: Validate workflow and privacy policy
        run: node scripts/validate-ci.cjs
